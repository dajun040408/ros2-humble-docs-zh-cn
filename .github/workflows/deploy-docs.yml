name: Build and deploy ROS 2 Humble Chinese docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout translation project
        uses: actions/checkout@v4

      - name: Checkout ROS 2 Humble upstream documentation
        uses: actions/checkout@v4
        with:
          repository: ros2/ros2_documentation
          ref: humble
          path: upstream

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: upstream/requirements.txt

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r upstream/requirements.txt -c upstream/constraints.txt

      - name: Overlay Chinese translations and configure Humble build
        run: python scripts/prepare_build.py --upstream upstream

      - name: Build HTML documentation (report warnings without blocking publication)
        run: |
          set -o pipefail
          # The upstream Makefile enables -W by default. The current translation
          # overlay has a large warning backlog; keep warnings visible in logs,
          # but do not let warnings alone prevent HTML generation and deployment.
          make -C upstream html JOBS=2 OPTS="-c . -j2" 2>&1 | tee sphinx-build.log
          echo "Sphinx warning count: $(grep -c 'WARNING:' sphinx-build.log || true)"

      - name: Build Chinese search index
        run: python scripts/build_search_index.py --html-dir upstream/build/html



      - name: Stage site under /humble and configure custom domain
        run: |
          mkdir -p site/humble
          cp -a upstream/build/html/. site/humble/
          printf '%s\n' 'ros2docs.robook.org' > site/CNAME
          cat > site/index.html <<'EOF'
          <!doctype html>
          <html lang="zh-CN"><head><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=/humble/"><link rel="canonical" href="https://ros2docs.robook.org/humble/"><title>ROS 2 Humble 中文文档</title></head><body><a href="/humble/">进入 ROS 2 Humble 中文文档</a></body></html>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-22.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
