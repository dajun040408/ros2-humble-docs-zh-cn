name: Build and deploy ROS 2 Humble Chinese docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout translation project
        uses: actions/checkout@v4

      - name: Checkout ROS 2 Humble upstream documentation
        uses: actions/checkout@v4
        with:
          repository: ros2/ros2_documentation
          ref: humble
          path: upstream

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: upstream/requirements.txt

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r upstream/requirements.txt -c upstream/constraints.txt

      - name: Overlay Chinese translations and configure Humble build
        run: python scripts/prepare_build.py --upstream upstream

      - name: Build HTML documentation
        run: make -C upstream html JOBS=2

      - name: Build Chinese search index
        run: python scripts/build_search_index.py --html-dir upstream/build/html


      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: upstream/build/html

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-22.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
